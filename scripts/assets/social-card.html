<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1280, initial-scale=1" />
<title>CiteDuo — social preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #0b1220;
    color: #e8eef8;
    font-family: 'Inter', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(880px 520px at 6% -12%, rgba(16,185,129,.22), rgba(16,185,129,0) 60%),
      radial-gradient(760px 540px at 82% 120%, rgba(59,130,246,.22), rgba(59,130,246,0) 62%),
      linear-gradient(140deg, #0b1220 0%, #101b31 52%, #0b1220 100%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .5;
    background-image:
      linear-gradient(rgba(148,163,184,.075) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.075) 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(720px 520px at 26% 42%, #000 0%, transparent 76%);
    mask-image: radial-gradient(720px 520px at 26% 42%, #000 0%, transparent 76%);
  }
  .left {
    position: absolute; left: 0; top: 0; height: 640px; width: 640px;
    padding: 0 40px 0 72px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .accent { width: 58px; height: 5px; border-radius: 3px; margin-bottom: 26px;
            background: linear-gradient(90deg, #10b981, #34d399); box-shadow: 0 0 22px rgba(16,185,129,.55); }
  h1 {
    margin: 0; font-size: 54px; line-height: 1.05; font-weight: 800;
    letter-spacing: -1.2px; color: #f8fbff;
  }
  .sub { margin: 24px 0 0; font-size: 19px; line-height: 1.55; color: #9fb0c9; max-width: 476px; }
  .foot {
    position: absolute; left: 72px; bottom: 50px;
    font-size: 15px; color: #64748b; letter-spacing: .2px;
  }
  .shot {
    position: absolute; left: 656px; top: 64px; width: 568px; height: 512px;
    border-radius: 18px; overflow: hidden; background: #0f172a;
    border: 1px solid rgba(148,163,184,.22);
    box-shadow: 0 30px 64px -24px rgba(0,0,0,.9), 0 0 0 7px rgba(148,163,184,.05);
  }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 52% 50%; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="left">
    <div class="accent"></div>
    <h1>CiteDuo</h1>
    <p class="sub">Search papers. Map citations. See how two papers connect.</p>
  </div>
  <div class="foot">Self-hosted &middot; Bun + React + SQLite &middot; MIT</div>
  <div class="shot">
    <img src="../../docs/images/two-paper-connection.png" alt="Citation network with a two-paper relation analysis" />
  </div>
</body>
</html>
